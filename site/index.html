<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>¡Hola desde Ansible!</title>
  <style>
    /* Importa una fuente elegante */
    @import url('https://fonts.googleapis.com/css2?family=Lato:wght@300;700&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Lato', sans-serif;
      background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 3rem 2rem;
      text-align: center;
      max-width: 500px;
      width: 100%;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(10px);
    }

    h1 {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      font-weight: 700;
    }

    p {
      font-size: 1.1rem;
      margin-bottom: 1.5rem;
      line-height: 1.4;
    }

    .logo {
      width: 80px;
      margin-bottom: 1.5rem;
    }

    .button {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: #fff;
      color: #4facfe;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      transition: background 0.2s ease, color 0.2s ease;
    }

    .button:hover {
      background: #f0f0f0;
      color: #0066cc;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Puedes poner aquí un logo o imagen -->
    <img class="logo" src="https://www.nginx.com/wp-content/uploads/2018/08/NGINX-logo-rgb-large.png" alt="NGINX Logo" />
    <h1>¡Hola desde Ansible!</h1>
    <p>
      Esta página ha sido desplegada automáticamente por Ansible
      en tu servidor Docker / Nginx. ¡Disfruta de la automatización!
    </p>
    <a class="button" href="https://www.nginx.com/" target="_blank" rel="noopener">
      Aprende más sobre NGINX
    </a>
  </div>
</body>
</html>
